name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      tag-commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must be stable semver tags like v1.2.3."
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "${TAG}^{commit}")"

          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Check tag commit is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
          TAG_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag $TAG points to $TAG_COMMIT, which is not reachable from origin/main."
            exit 1
          fi

      - name: Check CI passed for tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -euo pipefail

          ci_run_url="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "ci.yml" \
              --commit "$TAG_COMMIT" \
              --json conclusion,headSha,status,url \
              --limit 20 \
              | jq --raw-output --arg sha "$TAG_COMMIT" 'map(select(.headSha == $sha and .status == "completed" and .conclusion == "success")) | .[0].url // empty'
          )"

          if [[ -z "$ci_run_url" ]]; then
            echo "::error::No successful ci.yml run was found for tag commit ${TAG_COMMIT}. Wait for CI on main to pass, then tag the same commit."
            exit 1
          fi

          echo "Found successful CI run for ${TAG_COMMIT}: ${ci_run_url}"

  move-major-tag:
    name: Move Major Tag
    needs:
      - release-preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Move major tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          TAG_COMMIT: ${{ needs.release-preflight.outputs.tag-commit }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must be stable semver tags like v1.2.3."
            exit 1
          fi

          major_tag="${TAG%%.*}"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${major_tag}" --silent >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major_tag}" \
              --field sha="$TAG_COMMIT" \
              --field force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              --field ref="refs/tags/${major_tag}" \
              --field sha="$TAG_COMMIT" >/dev/null
          fi

          echo "Moved ${major_tag} to ${TAG_COMMIT}."
