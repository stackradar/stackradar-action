name: Pull Request Label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  label:
    name: Release label
    runs-on: ubuntu-24.04
    steps:
      # The draft release sorts merged pull requests by these labels.
      - name: Require exactly one release label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          count="$(jq '[.[] | select(startswith("semver:"))] | length' <<<"$LABELS")"
          if [ "$count" -ne 1 ]; then
            echo "::error::Add exactly one label: semver:major, semver:minor, semver:patch or semver:chore."
            exit 1
          fi
