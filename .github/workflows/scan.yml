name: StackRadar

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the analyzed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Upload dependency evidence
        uses: stackradar/stackradar-action@v1
