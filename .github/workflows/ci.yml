name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  semver-label:
    name: Semver Label
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Require exactly one semver label
        uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
        with:
          mode: exactly
          count: 1
          labels: |
            semver:major
            semver:minor
            semver:patch
            semver:chore
          message: "Pull requests must have exactly one release label: {{ provided }}. Found: {{ applied }}."

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell syntax
        run: bash -n src/*.sh tests/*.sh scripts/*.sh

      - name: ShellCheck
        run: shellcheck -x src/*.sh tests/*.sh scripts/*.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

      - name: Action tests
        run: bash tests/run-tests.sh

  integration:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create dependency fixture
        shell: bash
        run: |
          printf '{"name":"stackradar-action-fixture"}\n' > package.json
          printf '{"lockfileVersion":3,"packages":{}}\n' > package-lock.json

      - name: Run local action
        uses: ./
        with:
          cli-version: v0.1.0
          mode: bundle-and-upload
          dry-run: "true"
          verify: strict
