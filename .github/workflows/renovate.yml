name: Renovate

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RENOVATE_REPOSITORIES: ${{ github.repository }}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    if: github.repository == 'stackradar/stackradar-action'
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Renovate's action builds this as <image>:<version>, so keep the
      # version in tag@digest form and let Renovate update both together.
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          configurationFile: .github/renovate-runner.json
          token: ${{ steps.get_token.outputs.token }}
          renovate-image: "ghcr.io/renovatebot/renovate"
          renovate-version: "43@sha256:3b72fc4274c56f65f53dcd4dcbed3143289358e0a2d96f7af215e6cf1923e5f6"
        env:
          LOG_LEVEL: info
